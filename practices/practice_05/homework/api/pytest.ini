[pytest]
pythonpath = .
testpaths = tests
addopts = -m "not live_api and not live_ui"
markers =
    controlled: HTTP contract on controlled dependencies or saved-file fixtures
    real_local: Real Bank/export_pdf with only upstream HTTP replaced
    live_api: Explicit actual server/source run; requires network
    live_ui: Explicit real UI/API/source integration; requires delivered UI
    mcp: Compatibility of the existing MCP interface
